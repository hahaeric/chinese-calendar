<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日历</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
  }

  .calendar {
    width: 100%;
    max-width: 980px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
    overflow: hidden;
  }

  /* ── Header ── */
  .calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 28px;
    border-bottom: 1px solid #eee;
  }

  .calendar-title {
    font-size: 22px;
    font-weight: 600;
    color: #1a1a2e;
    letter-spacing: 0.5px;
  }

  .calendar-title-wrap {
    flex: 1;
    text-align: center;
    min-width: 0;
  }

  .calendar-nav {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    border-radius: 8px;
    transition: background 0.15s, color 0.15s, box-shadow 0.15s;
    outline: none;
  }

  .btn-icon {
    width: 38px;
    height: 38px;
    background: transparent;
    color: #555;
    font-size: 18px;
    border-radius: 8px;
  }
  .btn-icon:hover { background: #f0f2f5; color: #1a1a2e; }
  .btn-icon:active { background: #e4e6e9; }

  .btn-today {
    height: 38px;
    padding: 0 18px;
    background: transparent;
    color: #4a6cf7;
    font-weight: 500;
    border: 1px solid #dce3ff;
  }
  .btn-today:hover {
    background: #eef1ff;
    border-color: #bcc7ff;
  }

  /* ── Search bar ── */
  .calendar-search {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    border-bottom: 1px solid #eee;
    background: #fafbfc;
  }

  .search-input {
    flex: 1;
    height: 38px;
    padding: 0 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    color: #1a1a2e;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search-input:focus {
    border-color: #4a6cf7;
    box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.12);
  }
  .search-input::placeholder { color: #aaa; }

  .btn-search {
    height: 38px;
    padding: 0 16px;
    background: #4a6cf7;
    color: #fff;
    font-weight: 500;
    white-space: nowrap;
  }
  .btn-search:hover { background: #3d5de0; }
  .btn-search:active { background: #3451c6; }

  .search-hint {
    font-size: 12px;
    color: #e05a5a;
    padding: 0 28px 10px;
    background: #fafbfc;
    border-bottom: 1px solid #eee;
    display: none;
  }
  .search-hint.visible { display: block; }

  /* ── Era info (黄帝纪年 & 天干地支) ── */
  .calendar-era {
    display: flex;
    gap: 16px;
    padding: 18px 28px;
    border-bottom: 1px solid #eee;
    background: #fdfaf3;
  }

  .era-item {
    flex: 1;
    text-align: center;
    padding: 16px 12px;
    background: #fff;
    border-radius: 12px;
    border: 1px solid #f0e6d0;
    box-shadow: 0 1px 4px rgba(139, 105, 20, 0.06);
  }

  .era-label {
    font-size: 14px;
    font-weight: 500;
    color: #999;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }

  .era-value {
    font-size: 28px;
    font-weight: 700;
    color: #8b6914;
    letter-spacing: 1.5px;
    line-height: 1.2;
  }

  /* ── Weekday row ── */
  .calendar-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    padding: 12px 12px 0;
    font-size: 13px;
    font-weight: 600;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .calendar-weekdays span.weekend {
    color: #c44;
  }

  /* ── Date grid ── */
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 8px 12px 16px;
    gap: 2px;
  }

  .day-cell {
    position: relative;
    min-height: 96px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 0;
    font-size: 15px;
    font-weight: 450;
    color: #333;
    border-radius: 10px;
    cursor: default;
    transition: background 0.12s;
    padding: 5px 2px 4px;
  }

  .day-num {
    line-height: 1.1;
    font-size: 16px;
    font-weight: 600;
  }

  .day-lunar {
    font-size: 10px;
    color: #666;
    margin-top: 3px;
    line-height: 1.1;
  }

  .day-term {
    font-size: 9px;
    font-weight: 700;
    color: #2d8a4e;
    line-height: 1.1;
    margin-top: 2px;
  }

  .day-hou {
    font-size: 9px;
    font-weight: 600;
    color: #b45309;
    line-height: 1.2;
    margin-top: 2px;
    text-align: center;
  }

  .day-hou-desc {
    font-size: 8px;
    color: #888;
    line-height: 1.3;
    text-align: center;
    padding: 0 2px;
    margin-top: 1px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-all;
  }

  .day-cell.today .day-lunar,
  .day-cell.today .day-hou-desc {
    color: rgba(255, 255, 255, 0.82);
  }

  .day-cell.today .day-term {
    color: rgba(255, 255, 255, 0.92);
  }

  .day-cell.today .day-hou {
    color: rgba(255, 255, 255, 0.95);
  }

  .day-cell.other-month .day-lunar,
  .day-cell.other-month .day-hou,
  .day-cell.other-month .day-hou-desc {
    opacity: 0.55;
  }

  .day-cell.other-month .day-term {
    color: #a8c9b0;
  }

  /* Searched date highlight */
  .day-cell.highlight {
    outline: 2px solid #4a6cf7;
    outline-offset: -2px;
    background: #eef1ff;
  }
  .day-cell.highlight.today {
    outline-color: #fff;
    box-shadow: 0 0 0 2px #4a6cf7, 0 2px 8px rgba(74, 108, 247, 0.3);
  }
  .day-cell:hover {
    background: #f5f6fa;
  }

  /* Today */
  .day-cell.today {
    background: #4a6cf7;
    color: #fff;
    font-weight: 600;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(74, 108, 247, 0.3);
  }
  .day-cell.today:hover {
    background: #3d5de0;
  }

  /* Other-month days */
  .day-cell.other-month {
    color: #c8c8cc;
    pointer-events: none;
  }

  /* Weekend colour (current month) */
  .day-cell.weekend:not(.other-month):not(.today) {
    color: #c44;
  }

  /* ── Footer info ── */
  .calendar-footer {
    text-align: center;
    padding: 8px 16px 18px;
    font-size: 13px;
    color: #999;
    line-height: 1.6;
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    body { padding: 16px 8px; }
    .calendar { border-radius: 12px; }
    .calendar-header { padding: 14px 16px; }
    .calendar-title { font-size: 18px; }
    .calendar-era { padding: 14px 16px; gap: 10px; }
    .era-item { padding: 12px 8px; }
    .era-label { font-size: 12px; margin-bottom: 6px; }
    .era-value { font-size: 22px; letter-spacing: 1px; }
    .btn-icon { width: 34px; height: 34px; font-size: 16px; }
    .btn-today { height: 34px; padding: 0 14px; font-size: 14px; }
    .calendar-search { padding: 10px 16px; gap: 6px; }
    .search-input { height: 34px; font-size: 13px; padding: 0 10px; }
    .btn-search { height: 34px; padding: 0 12px; font-size: 13px; }
    .search-hint { padding: 0 16px 8px; font-size: 11px; }
    .day-term { font-size: 8px; }
    .day-lunar { font-size: 9px; }
    .day-hou { font-size: 8px; }
    .day-hou-desc { font-size: 7px; -webkit-line-clamp: 2; }
    .calendar-weekdays { padding: 10px 6px 0; font-size: 12px; }
    .calendar-grid { padding: 4px 6px 12px; gap: 1px; }
    .day-cell { font-size: 14px; border-radius: 8px; min-height: 82px; padding: 4px 1px 3px; }
    .day-num { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="calendar">
  <!-- Header -->
  <div class="calendar-header">
    <button class="btn btn-today" onclick="goToToday()" title="回到今天">今天</button>
    <div class="calendar-title-wrap">
      <h2 class="calendar-title" id="title"></h2>
    </div>
    <div class="calendar-nav">
      <button class="btn btn-icon" onclick="changeMonth(-1)" title="上个月">

      </button>
      <button class="btn btn-icon" onclick="changeMonth(1)" title="下个月">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
      </button>
    </div>
  </div>

  <!-- Date search -->
  <div class="calendar-search">
    <input class="search-input" id="searchInput" type="text"
           placeholder="搜索日期，如 2026-06-01、2026年6月1日、6月1日"
           onkeydown="if(event.key==='Enter')searchDate()">
    <button class="btn btn-search" onclick="searchDate()">跳转</button>
  </div>
  <div class="search-hint" id="searchHint"></div>

  <!-- Era info -->
  <div class="calendar-era">
    <div class="era-item">
      <div class="era-label">黄帝纪年</div>
      <div class="era-value" id="huangdiYear"></div>
    </div>
    <div class="era-item">
      <div class="era-label">天干地支</div>
      <div class="era-value" id="ganZhiYear"></div>
    </div>
  </div>

  <!-- Weekday labels -->
  <div class="calendar-weekdays" id="weekdays"></div>

  <!-- Date grid -->
  <div class="calendar-grid" id="grid"></div>

  <!-- Footer -->
  <div class="calendar-footer" id="footer"></div>
</div>

<script>
const WEEKDAYS = ['一', '二', '三', '四', '五', '六', '日'];

const SOLAR_TERM_NAMES = [
  '小寒', '大寒', '立春', '雨水', '惊蛰', '春分', '清明', '谷雨',
  '立夏', '小满', '芒种', '夏至', '小暑', '大暑', '立秋', '处暑',
  '白露', '秋分', '寒露', '霜降', '立冬', '小雪', '大雪', '冬至',
];

// Minutes offset from 1900-01-06 02:05 UTC for each solar term
const SOLAR_TERM_INFO = [
  0, 21208, 42467, 63836, 85337, 107014, 128867, 150921,
  173149, 195551, 218072, 240693, 263343, 285989, 308563, 331033,
  353350, 375494, 397447, 419210, 440795, 462224, 483532, 504758,
];

const HEAVENLY_STEMS = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
const EARTHLY_BRANCHES = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];

// 黄帝纪年：公元纪年 + 2697（通用换算）
const HUANGDI_ERA_OFFSET = 2697;

let state = {
  year: 0,
  month: 0,   // 0-based (0 = Jan)
  highlight: null, // { year, month, day } searched date
};

const el = {
  title:  document.getElementById('title'),
  huangdiYear: document.getElementById('huangdiYear'),
  ganZhiYear:  document.getElementById('ganZhiYear'),
  weekdays: document.getElementById('weekdays'),
  grid:   document.getElementById('grid'),
  footer: document.getElementById('footer'),
  searchInput: document.getElementById('searchInput'),
  searchHint:  document.getElementById('searchHint'),
};

// ── helpers ──
function daysInMonth(y, m) {
  return new Date(y, m + 1, 0).getDate();
}

function firstDayOfWeek(y, m) {
  // 0 = Sunday … 6 = Saturday
  return new Date(y, m, 1).getDay();
}

function isToday(y, m, d) {
  const t = new Date();
  return t.getFullYear() === y && t.getMonth() === m && t.getDate() === d;
}

function isValidDate(y, m, d) {
  if (m < 0 || m > 11 || d < 1) return false;
  return d <= daysInMonth(y, m);
}

function isHighlighted(y, m, d) {
  const h = state.highlight;
  return h && h.year === y && h.month === m && h.day === d;
}

// ── 24 solar terms ──
function getSolarTermDate(year, termIndex) {
  const utcMs = Date.UTC(1900, 0, 6, 2, 5)
    + (31556925974.7 * (year - 1900) + SOLAR_TERM_INFO[termIndex] * 60000);
  const d = new Date(utcMs);
  return { year: d.getFullYear(), month: d.getMonth(), day: d.getDate() };
}

function getSolarTermsInMonth(year, month) {
  const map = {};
  for (let yOff = -1; yOff <= 1; yOff++) {
    const y = year + yOff;
    for (let n = 0; n < 24; n++) {
      const td = getSolarTermDate(y, n);
      if (td.year === year && td.month === month) {
        map[td.day] = SOLAR_TERM_NAMES[n];
      }
    }
  }
  return map;
}

// ── 农历 ──
const LUNAR_INFO = [

  0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,

  0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,

  0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,0x0b5a0,0x056d0,
  0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,0x14b63,0x09370,
  0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,0x0a2e0,0x0d2e3,
  0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,0x052d0,0x0a9b8,
  0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,0x0b273,0x06930,
  0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,0x0e968,0x0d520,
  0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,0x0d520,
];

const LUNAR_MONTH_NAMES = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
const LUNAR_DAY_NAMES = [
  '初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
  '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
  '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十',
];

const LUNAR_BASE = new Date(1900, 0, 31);

function leapMonth(y) {
  return LUNAR_INFO[y - 1900] & 0xf;
}

function leapDays(y) {
  if (!leapMonth(y)) return 0;
  return (LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29;
}

function lunarMonthDays(y, m) {
  return (LUNAR_INFO[y - 1900] & (0x10000 >> m)) ? 30 : 29;
}

function lunarYearDays(y) {
  let sum = 348;
  const info = LUNAR_INFO[y - 1900];
  for (let i = 0x8000; i > 0x8; i >>= 1) {
    sum += (info & i) ? 1 : 0;
  }
  return sum + leapDays(y);
}

function solarToLunar(y, m, d) {
  let offset = Math.floor((new Date(y, m, d) - LUNAR_BASE) / 86400000);
  if (offset < 0 || y < 1900 || y > 2100) return { text: '' };

  let lunarYear = 1900;
  while (lunarYear <= 2100) {
    const days = lunarYearDays(lunarYear);
    if (offset < days) break;
    offset -= days;
    lunarYear++;
  }

  const leap = leapMonth(lunarYear);
  let isLeap = false;
  let lunarMonth = 1;

  for (let i = 1; i <= 12; i++) {
    let days = lunarMonthDays(lunarYear, i);
    if (leap > 0 && i === leap + 1 && !isLeap) {
      i--;
      isLeap = true;
      days = leapDays(lunarYear);
    } else {
      isLeap = false;
    }
    if (offset < days) break;
    offset -= days;
    lunarMonth++;
  }

  const lunarDay = offset + 1;
  const text = lunarDay === 1
    ? (isLeap ? '闰' : '') + LUNAR_MONTH_NAMES[lunarMonth - 1] + '月'
    : LUNAR_DAY_NAMES[lunarDay - 1];
  return { text };
}

// ── 七十二候（每节气三候） ──

   { name: '仓庚鸣', desc: '黄鹂鸟开始鸣叫' },
   { name: '鹰化为鸠', desc: '鹰隼化为温顺的鸠鸟' }],

  [{ name: '蝼蝈鸣', desc: '蝼蛄开始鸣叫' },

function dateToDays(y, m, d) {
  return Math.floor(new Date(y, m, d).getTime() / 86400000);
}

function getHouInfo(y, m, d) {
  const target = dateToDays(y, m, d);
  let bestIndex = 23;
  let bestDays = -Infinity;

  for (let yOff = -1; yOff <= 1; yOff++) {
    const yr = y + yOff;
    for (let n = 0; n < 24; n++) {
      const td = getSolarTermDate(yr, n);
      const termDays = dateToDays(td.year, td.month, td.day);
      if (termDays <= target && termDays > bestDays) {
        bestDays = termDays;
        bestIndex = n;
      }
    }
  }

  const daysSince = target - bestDays;
  const houIndex = Math.min(2, Math.floor(daysSince / 5));
  const termName = SOLAR_TERM_NAMES[bestIndex];
  const hou = SOLAR_TERM_HOU[bestIndex][houIndex];

  return {
    term: termName,
    label: HOU_LABELS[houIndex],
    name: hou.name,
    desc: hou.desc,
    title: `${termName}${HOU_LABELS[houIndex]} · ${hou.name}`,
  };
}

function buildDayCellHtml(y, m, d, extraClass, termMap) {
  const lunar = solarToLunar(y, m, d);
  const hou = getHouInfo(y, m, d);
  const term = termMap[d];
  const termHtml = term ? `<span class="day-term">${term}</span>` : '';
  const lunarHtml = lunar.text ? `<span class="day-lunar">${lunar.text}</span>` : '';
  const houHtml = `<span class="day-hou">${hou.title}</span>`;
  const descHtml = `<span class="day-hou-desc">${hou.desc}</span>`;

  return `<div class="day-cell${extraClass}" title="${hou.title}：${hou.desc}">` +
    `<span class="day-num">${d}</span>${lunarHtml}${termHtml}${houHtml}${descHtml}</div>`;
}

// ── 黄帝纪年 & 天干地支 ──
function getHuangdiYear(gregorianYear) {
  return gregorianYear + HUANGDI_ERA_OFFSET;
}

function isBeforeLiChun(year, month, day) {
  const liChun = getSolarTermDate(year, 2); // 立春
  if (month < liChun.month) return true;
  if (month > liChun.month) return false;
  return day < liChun.day;
}

function getGanZhiYear(gregorianYear, month, day) {
  let gzYear = gregorianYear;
  if (isBeforeLiChun(gregorianYear, month, day)) gzYear--;
  const stem = HEAVENLY_STEMS[((gzYear - 4) % 10 + 10) % 10];
  const branch = EARTHLY_BRANCHES[((gzYear - 4) % 12 + 12) % 12];
  return stem + branch + '年';
}

function getGanZhiForView(year, month) {
  const today = new Date();
  if (year === today.getFullYear() && month === today.getMonth()) {
    return getGanZhiYear(year, month, today.getDate());
  }
  return getGanZhiYear(year, month, 15);
}

function showSearchHint(msg, isError) {
  if (!msg) {
    el.searchHint.classList.remove('visible');
    el.searchHint.textContent = '';
    return;
  }
  el.searchHint.textContent = msg;
  el.searchHint.style.color = isError ? '#e05a5a' : '#2d8a4e';
  el.searchHint.classList.add('visible');
}

function parseDateInput(str) {
  str = str.trim();
  if (!str) return null;

  let m = str.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
  if (m) return { year: +m[1], month: +m[2] - 1, day: +m[3] };

  m = str.match(/^(\d{4})年(\d{1,2})月(\d{1,2})日?$/);
  if (m) return { year: +m[1], month: +m[2] - 1, day: +m[3] };

  m = str.match(/^(\d{1,2})月(\d{1,2})日?$/);
  if (m) return { year: state.year, month: +m[1] - 1, day: +m[2] };

  return null;
}

function formatDateLabel(y, m, d) {
  const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  return new Date(y, m, d).toLocaleDateString('zh-CN', opts);
}

// ── render ──
function render() {
  const { year, month } = state;
  const today = new Date();

  // Title
  el.title.textContent = `${year}年 ${month + 1}月`;

  // Era info
  const ty = today.getFullYear();
  el.huangdiYear.textContent = `${getHuangdiYear(ty)} 年`;
  el.ganZhiYear.textContent = getGanZhiForView(year, month);

  // Weekday headers
  el.weekdays.innerHTML = WEEKDAYS
    .map((d, i) => `<span${i >= 5 ? ' class="weekend"' : ''}>${d}</span>`)
    .join('');

  // Date grid
  const totalDays = daysInMonth(year, month);
  const startDay = firstDayOfWeek(year, month);             // 0=Sun → we map to Mon=0
  const prevMonthDays = startDay === 0 ? 6 : startDay - 1;  // cells from previous month

  const prevMonth = month === 0 ? 11 : month - 1;
  const prevYear  = month === 0 ? year - 1 : year;
  const prevDays   = daysInMonth(prevYear, prevMonth);

  const nextMonth = month === 11 ? 0 : month + 1;
  const nextYear  = month === 11 ? year + 1 : year;

  const termsPrev = getSolarTermsInMonth(prevYear, prevMonth);
  const termsCurr = getSolarTermsInMonth(year, month);
  const termsNext = getSolarTermsInMonth(nextYear, nextMonth);

  let html = '';

  // Previous-month days
  for (let i = prevDays - prevMonthDays + 1; i <= prevDays; i++) {
    html += buildDayCellHtml(prevYear, prevMonth, i, ' other-month', termsPrev);
  }

  // Current-month days
  for (let d = 1; d <= totalDays; d++) {
    const dow = (prevMonthDays + d - 1) % 7; // 0=Mon … 6=Sun
    const weekend = dow >= 5 ? ' weekend' : '';
    const todayClass = isToday(year, month, d) ? ' today' : '';
    const highlightClass = isHighlighted(year, month, d) ? ' highlight' : '';
    html += buildDayCellHtml(year, month, d, `${todayClass}${highlightClass}${weekend}`, termsCurr);
  }

  // Next-month days (fill remaining cells of the 6th row)
  const totalCells = prevMonthDays + totalDays;
  const remaining = totalCells <= 35 ? 35 - totalCells : 42 - totalCells;
  for (let d = 1; d <= remaining; d++) {
    html += buildDayCellHtml(nextYear, nextMonth, d, ' other-month', termsNext);
  }

  el.grid.innerHTML = html;

  // Footer
  const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  let footerText = `今天是 ${today.toLocaleDateString('zh-CN', opts)}`;
  if (state.highlight) {
    const { year: hy, month: hm, day: hd } = state.highlight;
    const ht = getSolarTermsInMonth(hy, hm)[hd];
    footerText += ` · 已定位至 ${formatDateLabel(hy, hm, hd)}${ht ? '（' + ht + '）' : ''}`;
  }
  el.footer.textContent = footerText;
}

// ── actions ──
function changeMonth(delta) {
  let m = state.month + delta;
  if (m < 0) { m = 11; state.year--; }
  else if (m > 11) { m = 0; state.year++; }
  state.month = m;
  state.highlight = null;
  showSearchHint('');
  render();
}

function goToToday() {
  const t = new Date();
  state.year  = t.getFullYear();
  state.month = t.getMonth();
  state.highlight = null;
  showSearchHint('');
  render();
}

function searchDate() {
  const raw = el.searchInput.value;
  const parsed = parseDateInput(raw);

  if (!parsed) {
    showSearchHint('无法识别日期格式，请使用如 2026-06-01、2026年6月1日 或 6月1日', true);
    return;
  }

  const { year, month, day } = parsed;
  if (!isValidDate(year, month, day)) {
    showSearchHint(`无效日期：${year}年${month + 1}月${day}日`, true);
    return;
  }

  state.year = year;
  state.month = month;
  state.highlight = { year, month, day };
  const term = getSolarTermsInMonth(year, month)[day];
  showSearchHint(`已跳转至 ${formatDateLabel(year, month, day)}${term ? '（' + term + '）' : ''}`, false);
  render();
}

// ── init ──
(function init() {
  const t = new Date();
  state.year  = t.getFullYear();
  state.month = t.getMonth();
  render();
})();
</script>
